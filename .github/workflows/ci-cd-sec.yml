name: CI/CD - Spring Boot DevSecOps

on:
  push:
    branches:
      - main
      - develop
      - proyecto-final-devsecops
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. BUILD + TEST
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build & test
        run: mvn -B clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7

  # 2. SAST - SEMGREP
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep \
            semgrep scan \
              --config p/java \
              --json \
              --output /src/semgrep-report.json \
              /src/src/main/java

      - name: Upload Semgrep JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: error
          retention-days: 14

  # 3. SAST - CODEQL
  sast-codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          queries: security-and-quality

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"

  # 4. SCA - OWASP DEPENDENCY-CHECK
  sca-dependency-check:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run OWASP Dependency-Check
        id: dependency_check
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        shell: bash
        run: |
          EXTRA_ARGS=()

          if [ -n "$NVD_API_KEY" ]; then
            echo "NVD API Key configured."
            EXTRA_ARGS+=("-DnvdApiKey=$NVD_API_KEY")
          else
            echo "::warning::NVD API Key not configured."
          fi

          mvn -B \
            org.owasp:dependency-check-maven:13.0.0:check \
            -Dformat=JSON \
            -DfailBuildOnCVSS=11 \
            -DossIndexAnalyzerEnabled=false \
            "${EXTRA_ARGS[@]}"

      - name: Report Dependency-Check status
        if: always()
        shell: bash
        run: |
          echo "Dependency-Check outcome: ${{ steps.dependency_check.outcome }}"

          if [[ "${{ steps.dependency_check.outcome }}" != "success" ]]; then
            echo "::warning::Dependency-Check no pudo completar el análisis."
            echo "::warning::SCA es un control opcional y el pipeline continuará."
          fi

      - name: Upload Dependency-Check JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.json
          if-no-files-found: warn
          retention-days: 14

  # 5. STATIC ANALYSIS - SPOTBUGS
  static-analysis:
    name: Static Analysis - SpotBugs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile project
        run: mvn -B clean compile

      - name: Run SpotBugs
        run: |
          mvn -B \
            com.github.spotbugs:spotbugs-maven-plugin:4.10.4.1:spotbugs \
            -Dspotbugs.xmlOutput=true \
            -Dspotbugs.htmlOutput=true

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: |
            target/spotbugs*.xml
            target/reports/spotbugs.html
          if-no-files-found: warn
          retention-days: 14

  # 6. QUALITY GATE
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - sast-semgrep
      - sast-codeql
      - sca-dependency-check
      - static-analysis
    if: always()

    steps:
      - name: Validate CI results
        shell: bash
        run: |
          echo "============================================"
          echo "          DEVSECOPS QUALITY GATE"
          echo "============================================"
          echo "Build & Test : ${{ needs.build-and-test.result }}"
          echo "Semgrep      : ${{ needs.sast-semgrep.result }}"
          echo "CodeQL       : ${{ needs.sast-codeql.result }}"
          echo "SCA          : ${{ needs.sca-dependency-check.result }}"
          echo "SpotBugs     : ${{ needs.static-analysis.result }}"

          FAILED=0

          if [[ "${{ needs.build-and-test.result }}" != "success" ]]; then
            echo "::error::Build or tests failed"
            FAILED=1
          fi

          if [[ "${{ needs.sast-semgrep.result }}" != "success" ]]; then
            echo "::error::Semgrep execution failed"
            FAILED=1
          fi

          if [[ "${{ needs.sast-codeql.result }}" != "success" ]]; then
            echo "::error::CodeQL execution failed"
            FAILED=1
          fi

          if [[ "${{ needs.static-analysis.result }}" != "success" ]]; then
            echo "::error::SpotBugs execution failed"
            FAILED=1
          fi

          if [[ "${{ needs.sca-dependency-check.result }}" != "success" ]]; then
            echo "::warning::Dependency-Check did not complete successfully"
          fi

          if [[ "$FAILED" -eq 1 ]]; then
            echo "============================================"
            echo "QUALITY GATE FAILED"
            echo "============================================"
            exit 1
          fi

          echo "============================================"
          echo "QUALITY GATE PASSED"
          echo "============================================"

  # 7. DOCKER + TRIVY
  docker-security:
    name: Docker Build → Trivy Security Scan
    runs-on: ubuntu-latest
    needs:
      - quality-gate

    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/proyecto-final-devsecops')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: devsecops-local:${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-local:${{ github.sha }}
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH
          exit-code: '0'
          scanners: vuln

      - name: Upload Trivy JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Review Trivy findings
        id: trivy_review
        shell: bash
        run: |
          python <<'PY'
          import json
          import os
          import sys

          report = "trivy-report.json"

          if not os.path.exists(report):
              print("::error::Trivy report was not generated.")
              sys.exit(1)

          try:
              with open(report, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as exc:
              print(f"::error::Unable to read Trivy report: {exc}")
              sys.exit(1)

          findings = []

          for result in data.get("Results", []):
              for vulnerability in result.get("Vulnerabilities") or []:
                  severity = str(
                      vulnerability.get("Severity", "")
                  ).upper()

                  if severity in ("HIGH", "CRITICAL"):
                      findings.append({
                          "id": vulnerability.get(
                              "VulnerabilityID",
                              "UNKNOWN"
                          ),
                          "package": vulnerability.get(
                              "PkgName",
                              "unknown"
                          ),
                          "severity": severity
                      })

          critical = [
              item for item in findings
              if item["severity"] == "CRITICAL"
          ]

          high = [
              item for item in findings
              if item["severity"] == "HIGH"
          ]

          print("")
          print("============================================")
          print("          TRIVY SECURITY RESULTS")
          print("============================================")
          print(f"CRITICAL findings : {len(critical)}")
          print(f"HIGH findings     : {len(high)}")
          print(f"TOTAL findings    : {len(findings)}")
          print("============================================")

          output_file = os.environ["GITHUB_OUTPUT"]

          if findings:
              with open(output_file, "a", encoding="utf-8") as f:
                  f.write("has_blocking=true\n")

              print("")
              print("Security findings detected.")
              print("The report was preserved for DefectDojo analysis.")
              print("The vulnerable image will not be published to GHCR.")
              print("")

              for item in findings[:20]:
                  print(
                      f"::warning::{item['id']} | "
                      f"{item['severity']} | "
                      f"{item['package']}"
                  )

              if len(findings) > 20:
                  print(
                      f"... and {len(findings) - 20} additional findings."
                  )

              sys.exit(0)

          with open(output_file, "a", encoding="utf-8") as f:
              f.write("has_blocking=false\n")

          print("")
          print("TRIVY SCAN PASSED")
          print("No HIGH or CRITICAL vulnerabilities detected.")
          PY

      - name: Log in to GitHub Container Registry
        if: |
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.trivy_review.outputs.has_blocking == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        if: |
          success() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.trivy_review.outputs.has_blocking == 'false'
        shell: bash
        run: |
          TARGET="${REGISTRY}/${IMAGE_NAME}"

          docker tag \
            devsecops-local:${GITHUB_SHA} \
            "${TARGET}:${GITHUB_SHA}"

          docker tag \
            devsecops-local:${GITHUB_SHA} \
            "${TARGET}:latest"

          docker push "${TARGET}:${GITHUB_SHA}"
          docker push "${TARGET}:latest"