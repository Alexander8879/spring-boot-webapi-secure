name: CI Feature Branch

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - develop

jobs:
  build-and-sast:
    name: Build & SAST Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compilar y Ejecutar Pruebas Unitarias
        run: mvn clean test

      - name: Ejecutar SpotBugs (SAST Bytecode)
        run: |
          mvn com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:spotbugs \
            -Dspotbugs.effort=Max \
            -Dspotbugs.threshold=Low \
            -Dspotbugs.xmlOutput=true \
            -Dspotbugs.failOnError=false

      - name: Ejecutar Semgrep (SAST Código Fuente)
        run: |
          pip install semgrep
          semgrep scan --config "p/owasp-top-ten" --json -o semgrep-report.json || true

      - name: Evaluar Quality Gate (SAST)
        run: |
          python3 .github/scripts/quality_gate.py semgrep-report.json /dev/null

      - name: Subir Reporte Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-feature-report
          path: semgrep-report.json