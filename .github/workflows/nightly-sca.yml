name: CI/CD Nightly + SCA

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  nightly-security-audit:
    name: Nightly Dependency & SAST Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Escaneo Exhaustivo Semgrep
        run: |
          pip install semgrep
          semgrep scan --config "p/security-audit" --config "p/owasp-top-ten" --json -o semgrep-report.json || true

      - name: Escaneo SCA (OWASP Dependency-Check)
        run: |
          mvn org.owasp:dependency-check-maven:11.1.1:check \
            -Dformat=ALL \
            -DfailOnError=false \
            -DossindexAnalyzerEnabled=true

      - name: Evaluar Quality Gate Integral (SAST + SCA)
        run: |
          python3 .github/scripts/quality_gate.py semgrep-report.json target/dependency-check-report.json

      - name: Archivar Evidencias y Reportes de Seguridad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: |
            semgrep-report.json
            target/dependency-check-report.html
            target/dependency-check-report.json