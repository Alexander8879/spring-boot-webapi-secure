name: CI/CD Nightly + SCA

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  nightly-security-audit:
    name: Nightly Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build & Test (con JaCoCo Cobertura)
        run: mvn clean test -DskipTests=false

      - name: Static Analysis - SpotBugs
        run: |
          mvn com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:spotbugs \
            -Dspotbugs.effort=Max \
            -Dspotbugs.threshold=Low \
            -Dspotbugs.xmlOutput=true \
            -Dspotbugs.htmlOutput=true \
            -Dspotbugs.failOnError=false

      - name: SCA - OWASP Dependency-Check
        run: |
          mvn org.owasp:dependency-check-maven:11.1.1:check \
            -Dformat=ALL \
            -DfailOnError=false \
            -DossindexAnalyzerEnabled=true

      # --- ARTEFACTO 1: OWASP Dependency-Check ---
      - name: Subir artefacto Dependency Check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json

      # --- ARTEFACTO 2: SpotBugs ---
      - name: Subir artefacto SpotBugs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-spotbugs-report
          path: |
            target/spotbugsXml.xml
            target/reports/spotbugs.html
            target/spotbugs.html

      # --- ARTEFACTO 3: Tests & Cobertura ---
      - name: Subir artefacto Test & Cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/