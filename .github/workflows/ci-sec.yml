name: CI - Spring Boot DevSecOps

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx2g'

jobs:
  # 1. BUILD + TEST + COVERAGE
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build & run tests with coverage
        run: |
          mvn -B clean verify \
            -DskipITs=false \
            org.jacoco:jacoco-maven-plugin:prepare-agent \
            org.jacoco:jacoco-maven-plugin:report

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 7

  # 2. SAST - CODEQL
  sast-codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          queries: security-and-quality

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java"

  # 3. SCA - OWASP DEPENDENCY-CHECK
  # Control opcional e informativo.
  sca-dependency-check:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -Dformat=JSON \
            -DfailBuildOnCVSS=7

      - name: Upload Dependency-Check JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.json
          if-no-files-found: warn
          retention-days: 14

  # 4. STATIC ANALYSIS - SPOTBUGS + PMD
  static-analysis:
    name: Static Analysis - SpotBugs + PMD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run SpotBugs & PMD
        run: |
          mvn -B clean compile \
            com.github.spotbugs:spotbugs-maven-plugin:check \
            org.apache.maven.plugins:maven-pmd-plugin:check || true

      - name: Upload SpotBugs / PMD reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            target/spotbugsXml.xml
            target/pmd.xml
          if-no-files-found: warn
          retention-days: 7

  # 5. QUALITY GATE
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - sast-codeql
      - sca-dependency-check
      - static-analysis
    if: always()

    steps:
      - name: Check previous job results
        shell: bash
        run: |
          echo "============================================"
          echo "          DEVSECOPS QUALITY GATE"
          echo "============================================"
          echo "Build & Test    : ${{ needs.build-and-test.result }}"
          echo "CodeQL          : ${{ needs.sast-codeql.result }}"
          echo "SCA             : ${{ needs.sca-dependency-check.result }}"
          echo "Static Analysis : ${{ needs.static-analysis.result }}"

          FAILED=0

          if [[ "${{ needs.build-and-test.result }}" != "success" ]]; then
            echo "::error::Build or tests failed"
            FAILED=1
          fi

          if [[ "${{ needs.sast-codeql.result }}" != "success" ]]; then
            echo "::error::CodeQL analysis failed"
            FAILED=1
          fi

          if [[ "${{ needs.sca-dependency-check.result }}" != "success" ]]; then
            echo "::warning::Dependency-Check did not complete successfully"
          fi

          if [[ "${{ needs.static-analysis.result }}" != "success" ]]; then
            echo "::error::Static analysis failed"
            FAILED=1
          fi

          if [[ "$FAILED" -eq 1 ]]; then
            echo "============================================"
            echo "QUALITY GATE FAILED"
            echo "============================================"
            exit 1
          fi

          echo "============================================"
          echo "QUALITY GATE PASSED"
          echo "============================================"