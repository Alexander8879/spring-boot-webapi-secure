name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-sast-deploy:
    name: Build, Security Gate & Packaging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compilar y Test de Integración
        run: mvn clean verify -DskipTests=false

      - name: SpotBugs SAST
        run: |
          mvn com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:spotbugs \
            -Dspotbugs.effort=Max \
            -Dspotbugs.threshold=Low \
            -Dspotbugs.xmlOutput=true \
            -Dspotbugs.failOnError=false

      - name: Semgrep SAST
        run: |
          pip install semgrep
          semgrep scan --config "p/owasp-top-ten" --json -o semgrep-report.json || true

      - name: Ejecutar Quality Gate
        run: |
          python3 .github/scripts/quality_gate.py semgrep-report.json /dev/null

      - name: Empaquetar Artefacto JAR
        run: mvn package -DskipTests

      - name: Despliegue Simulado por Entorno
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "==== DEPLOYING TO PRODUCTION ENVIRONMENT ===="
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "==== DEPLOYING TO STAGING ENVIRONMENT ===="
          fi